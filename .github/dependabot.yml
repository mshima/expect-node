version: 2
updates:
  # Every update, the minor and patch ones in two PRs: the packages bundled in dist (the versions of the lockfile, an
  # install of expect-node none of their ranges), first of the groups, and the tools.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      bundled:
        patterns: ['@jest/expect-utils', 'expect', 'jest-diff', 'jest-matcher-utils', 'jest-mock', 'pretty-format']
        update-types: [minor, patch]
      tools:
        patterns: ['*']
        update-types: [minor, patch]
  # The major updates only: the tags of the majors take the minor and patch ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
