version: 2
updates:
  # Every update: the packages bundled in dist are the versions of the lockfile, the minor and patch ones in a PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # The major updates only: the tags of the majors take the minor and patch ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
